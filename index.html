<!DOCTYPE html>

<style>

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.4 system-ui,Segoe UI,Roboto,sans-serif}

@media(max-width:1150px){main{grid-template-columns:1fr}}

.k{cursor:pointer}

.kcap{fill:#1b1d21;stroke:#4a4f57;stroke-width:2}

.rk{cursor:pointer}.rk:hover rect{fill:#3a4350}

.strip{display:flex;gap:4px;justify-content:center;padding:6px 0 0;flex-wrap:wrap}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}

.tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}

.row{display:flex;align-items:center;gap:8px;margin:4px 0}

table.kt td,table.kt th{border-bottom:1px solid var(--line);padding:3px 4px;text-align:left;vertical-align:top}

.tag{display:inline-block;background:#262b33;border:1px solid #444b55;border-radius:3px;padding:0 5px;font-size:11px;font-weight:600;color:#fff}

.chip.W{border-color:var(--bad);color:#ff9a9a}.chip.C{border-color:var(--warn);color:#ffd36b}.chip.A{border-color:#bbb;color:#ddd}.chip.I{border-color:var(--ok);color:#9ef0b0}
.chip.act{background:#3a1f1f}

.task.done .ck{background:var(--ok);border-color:var(--ok);color:#000}
.task.done span{color:var(--mut);text-decoration:line-through}
.note{color:var(--mut);font-size:11.5px}
#tip{position:fixed;z-index:50;pointer-events:none;background:#000d;border:1px solid var(--acc);border-radius:6px;padding:5px 8px;max-width:280px;font-size:12px;display:none}

.swrow{display:flex;gap:8px;flex-wrap:wrap}.swb{width:100px;text-align:center;font-size:10px;color:#cfd6df;line-height:1.2}.swb svg{cursor:pointer;display:block;margin:0 auto}
.fb{padding:10px 8px;border:2px solid #6b7480;border-radius:6px;background:#2a2e35;font-weight:700;min-width:70px}.fb small{display:block;font-size:8px;font-weight:400;color:#ff9a9a}

@keyframes bl{to{filter:brightness(1.6)}}

.rot{text-align:center;min-width:70px;background:#181b20;border:1px solid #3a414c;border-radius:6px;padding:4px}.rot.dis{opacity:.5}
.rl{font-size:10px;color:#8b94a1}.rv{font-size:15px;font-variant-numeric:tabular-nums;cursor:pointer;padding:3px;border-radius:4px;border:1px solid #444}.rv.eng{border-color:#2bd94a;color:#4cd964;box-shadow:0 0 6px #2bd94a55}
.rot button{padding:0 8px;margin:2px}
.gtn{background:#2a2d33;border:2px solid #55606d;border-radius:8px;padding:8px;max-width:620px}.gtn.off .gscr{opacity:.7}

.gtop{display:flex;gap:6px;margin-bottom:6px}.gf{flex:1;background:#0d1117;border:1px solid #2b313a;border-radius:4px;padding:3px 6px;font-size:13px;cursor:pointer}.gf small{color:#8b94a1;font-size:12px}.gf.sel{border-color:#35c8ff;color:#9be2ff}
.gx{background:#0d1117;border:1px solid #2b313a;border-radius:4px;display:flex;align-items:center;padding:0 10px;cursor:pointer}
.ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px}.ggrid button{padding:18px 4px}
.gmap{width:100%;display:block}.glist .gi{padding:5px 8px;border-bottom:1px solid #1d232b;cursor:pointer;display:flex;gap:8px}.glist .gi span{margin-left:auto;color:#8b94a1}
.gdto,.gxp,.gaux{padding:8px}.gdto input{background:#000;color:#fff;border:1px solid #35c8ff;padding:6px;border-radius:4px;font-size:16px;text-transform:uppercase;width:150px}

S.ml=[];            // {id,ack,t}
S.mlHist=[];
function alertOn(id){return S.ml.some(m=>m.id===id)}
function setAlert(id,on){
  const a=ALERTS.find(x=>x.id===id);if(!a)return;
  const ex=S.ml.find(m=>m.id===id);
  if(on&&!ex){
    S.ml.push({id,ack:a.c==='I',t:Date.now()});S.mlHist.push(id);
    if((a.c==='W'||a.c==='C')&&!(AUTO.has(id)&&!S.flying))MFDS.forEach(m=>{ if(m.id!=='MFD2'&&effPage(m)!=='FND'&&m.on&&!m.failed&&!m.locked){m.page='FND';m.sub='MAIN';m.edit=null;} });
    toast(`${a.c==='W'?'WARNING':a.c==='C'?'CAUTION':'ADVISORY'}: ${a.t}`);
  }
  if(!on&&ex)S.ml=S.ml.filter(m=>m.id!==id);
  applyEffects();renderAlertChips();
}
function applyEffects(){
  S.eng=[true,true];S.gen=[true,true];S.mgbLow=false;
  S.ml.forEach(m=>{const a=ALERTS.find(x=>x.id===m.id);if(!a||!a.fx)return;
    if(!AUTO.has(m.id)){if(a.fx==='e0')S.eng[0]=false;if(a.fx==='e1')S.eng[1]=false}
    if(AUTO.has(m.id)&&(a.fx==='g0'||a.fx==='g1'))return;
    if(a.fx==='g0')S.gen[0]=false;if(a.fx==='g1')S.gen[1]=false;
    if(a.fx==='mgb')S.mgbLow=true;
    const mp={att1:'ATT1',att2:'ATT2',air1:'AIR1',air2:'AIR2'};
    if(mp[a.fx])S.sens[mp[a.fx]]='fail';
  });
  ['ATT1','ATT2','AIR1','AIR2'].forEach(k=>{const fxn=k.toLowerCase();
    if(S.sens[k]==='fail'&&!S.ml.some(m=>(ALERTS.find(x=>x.id===m.id)||{}).fx===fxn))S.sens[k]='ok';});
}

/* ---------------- motores: partida, IDLE/FLIGHT, parada ---------------- */
function engStep(dt){
  const src=PW.bus.ESS1||PW.bus.ESS2||PW.bus.BAT;
  if(X.trn&&(ENG.some((e,k)=>e.st!=='RUN'||SW['eng'+(k+1)]!=='FLIGHT'||SW.fire[k]||X.fem[k])||!cbOK('amc1')||!cbOK('amc2'))){X.trn=false;X.trnAbort=Date.now()+10000;note('trn_abort');toast('TRAINING ABORTED: modo de treino de motor cancelado automaticamente')}
  for(let i=0;i<2;i++){
    const E=ENG[i],sw=SW['eng'+(i+1)],ok=S.eng[i]!==false;
    if(sw!=='OFF'&&((E.st==='OFF'&&E.n1<4)||E.st==='VENT')&&!SW.fire[i]){
      if(!(CBST.sga==='in'||CBST.sgb==='in')||(CBST[i?'f2a':'f1a']!=='in'&&CBST[i?'f2b':'f1b']!=='in')){if(!E.warn){E.warn=true;toast('Partida inibida: CB ST/IGN ou FADEC '+(i+1)+' puxado')}}
      else if(src&&PW.v>=18&&totalFuel()>1){E.t=E.st==='VENT'?E.n1/63*22:0;E.st='START';X.vent[i]=0;PW.suT=Date.now();note('eng_start_'+(i+1))}
      else if(!E.warn){E.warn=true;toast('ENG MAIN '+(i+1)+': sem energia elétrica (ligue BAT MSTR/EPU) ou sem combustível')}
    }
    if(sw==='OFF')E.warn=false;
    if(sw==='OFF'&&(E.st==='START'||E.st==='RUN'))E.st='STOP';
    if(SW.fire[i]&&(E.st==='START'||E.st==='RUN'||E.st==='VENT'))E.st='STOP';
    if(E.st==='VENT'){E.t+=dt;E.n1+=(20-E.n1)*Math.min(1,dt*0.5);E.n2+=(24-E.n2)*Math.min(1,dt*0.5);E.tot=Math.max(25,E.tot-dt*20);E.q=0;
      if(E.t>60||!src||PW.v<18){E.st='STOP';X.vent[i]=0}}
    if(E.st==='START'){
      E.t+=dt;const f=clamp(E.t/22,0,1);E.n1=63*f;E.n2=70*f;
      E.tot=E.t<13?40+740*(E.t/13):780-260*clamp((E.t-13)/9,0,1);
      if(E.t>=22){E.st='RUN';note('eng_idle_'+(i+1))}
    }
    if(E.st==='RUN'){
      const fl=sw==='FLIGHT';
      let q=!ok?0:(fl?(S.flying?clamp(S.pwr+(i?-0.4:0.4),0,105):6):1.5);
      if(X.trn&&fl&&ok&&S.flying)q=i===X.trnE?q*0.25:clamp(q*1.5,0,105);
      if(X.fem[i]&&ok)q=E.q+(q-E.q)*Math.min(1,dt*0.4);
      const n1T=!ok?30:(fl?80+0.26*q:63),n2T=!ok?55:(fl?101:70),k=Math.min(1,dt*1.2);
      E.n1+=(n1T-E.n1)*k;E.n2+=(n2T-E.n2)*k;E.q=q;E.tot=!ok?320:(fl?450+4.6*q:520);
      if(fl&&ok&&E.n2>99)note('eng_flight_'+(i+1));
    }
    if(E.st==='STOP'){E.n1*=Math.exp(-dt/6);E.n2*=Math.exp(-dt/7);E.tot=Math.max(25,E.tot-dt*35);E.q=0;if(E.n1<4){E.st='OFF';E.n1=0;E.n2=0}}
    if(E.st==='OFF'){E.n1=0;E.n2=0;E.tot=Math.max(20,E.tot-dt*5);E.q=0}
    S.n1[i]=E.n1;S.n2[i]=E.n2;S.tot[i]=E.tot;S.trq[i]=E.st==='RUN'?E.q:0;

  const m1=gc[0]||(bt1&&bt2&&(gc[1]||epu)),m2=gc[1]||epu||(bt1&&bt2&&gc[0]),B=PW.bus;
  B.MAIN1=m1;B.MAIN2=m2;B.BAT=bb;B.ESS1=m1||bb;B.ESS2=m2||bb;

  let load=6;CBS.forEach(c=>{if(!cbOK(c[0]))return;if(c[0]==='recept'&&SW.rcpt!=='ON')return;if(c[0]==='search'&&!X.sl)return;load+=c[3]});
  ENG.forEach(e=>{if(e.st==='START')load+=e.t<16?220:90});

  PW.tOnBat=(bb&&!src)?PW.tOnBat+dt*PW.tk:0;

  au('PWR−UP TST','I',pt>=0&&pt<10);au('PWR−UP TST OK','I',pt>=10&&pt<25);
  const st=PW.suT?(now-PW.suT)/1000:99;au('START−UP TST','I',st<10);au('START−UP TST OK','I',st>=10&&st<25&&PW.suT>0);

  au('BAT DISCHARGING','C',bb&&!src);
  au('SYS1 BUS TIE OPEN','C',(SW.bt1!=='NORM'||PW.btTrip[0])&&any);au('BUS TIE OPEN SYS2','C',(SW.bt2!=='NORM'||PW.btTrip[1])&&any);
  au('EMER SHED BUS ON','C',SW.emshd==='ON'&&any);

  MFDS.forEach(m=>{const n=m.id.slice(3);if(!m.cpu)return;
    au(m.id+' CPU1 MINOR DEG','A',!!any&&!m.cpu[0]&&m.cpu[1]);au(m.id+' CPU2 MINOR DEG','A',!!any&&m.cpu[0]&&!m.cpu[1])});
  au('EPU CONNECTED','I',epu);
  au('ELEC OVERLIMIT','C',PW.v>0&&PW.v<23.2&&!src);
  au('STBY BAT DISCH','C',!B.ESS2&&SW.stby==='ON'&&B.EMER);
  au('REAR PANEL C/B','A',CBS.some(c=>c[4]&&CBST[c[0]]!=='in')&&any);
  [0,1].forEach(i=>{const E=ENG[i],n=i+1;
    au('ENG'+n+' STARTER ON','I',E.st==='START'||E.st==='VENT');
    au(i?'FADEC EMER ENG2':'ENG1 FADEC EMER','C',X.fem[i]&&!!any);
    au(i?'TRAINING ENG2':'ENG1 TRAINING','I',X.trn&&X.trnE===i);
    au('FIRE BOT '+n+' TEST','I',X.g['ft'+n]==='TEST'&&!SW.bot[i]&&!!any);
    au(i?'IDLE ENG2':'ENG1 IDLE','C',E.st==='RUN'&&SW['eng'+n]==='IDLE');
    au(i?'FUEL VALVE CLSD ENG2':'ENG1 FUEL VALVE CLSD','C',SW.fire[i]);
    au(i?'FIRE BOT 2 USED':'FIRE BOT 1 USED','C',SW.bot[i]);});
  if(any&&PW.chg<=0.2&&!PW.gc[0]&&!PW.gc[1])toast('Bateria esgotada: falha elétrica total');
}

function apStep(dt){

  if(M.alta){const d=R.alta-S.alt;vsT=clamp(d*1.2,-1000,1000);if(Math.abs(d)<80){M.alta=false;M.alt=true;R.alt=R.alta;vsT=0;note('alta_capture')}}

  else if(M.fpa)vsT=Math.round(Math.sin(R.fpa*Math.PI/180)*S.gs*101.27);
  else if(M.crht){const ra=S.ra!=null?S.ra:S.alt;vsT=clamp((R.crht-ra)*1.0,-600,600)}
  else if(M.ga){vsT=1000;iasT=65}
  if((M.vs||M.fpa||M.ias&&vsT<0)&&S.alt<150&&vsT<0){M.vs=M.fpa=M.alta=false;M.alt=true;R.alt=150;vsT=0}

  if(vsT!=null)S.vs+=(vsT-S.vs)*k;else S.vs*=1-Math.min(1,dt);
  S.alt=clamp(S.alt+S.vs*dt/60,0,18000);

  else S.roll+=(0-S.roll)*Math.min(1,dt*2);
  S.pitch+=((vsT!=null?clamp(vsT/250,-8,10):2)-S.pitch)*Math.min(1,dt);
  return true;
}

function pgStep(m,d){
  if(m.sub==='WEIGHT'){m.sub=d>0?'PERF':'WEIGHT';openForm(m,m.sub);}
  else if(m.sub==='PERF'){if(d<0){m.sub='WEIGHT';openForm(m,'WEIGHT')}}
  else if(m.sub==='CONF'){if(d>0){m.sub='UNITS';openForm(m,'UNITS')}}
  else if(m.sub==='UNITS'){if(d<0){m.sub='CONF';openForm(m,'CONF')}}
  else if(m.sub==='STATUS'||m.sub==='REPORT'||m.sub==='EPC'){}
  else if(m.sub==='DATAB'){m.dbPg=clamp((m.dbPg||1)+d,1,10)}
}

/* ----------------------- formulários (páginas texto) ----------------------- */
function openForm(m,name){
  m.sel=false;m.formSel=-1;
  if(name==='WEIGHT')m.pending={...S.wt};
  else if(name==='PERF')m.pending={...S.perf};
  else if(name==='CONF')m.pending={...S.cfg};
  else if(name==='UNITS')m.pending={...S.units};
  m.form=name;
}
const FORMS={
  WEIGHT:{fields:['payload','crew','empty','hook'],step:{payload:[100,5],crew:[100,5],empty:[100,5],hook:[100,5]},range:{payload:[0,2100],crew:[50,1100],empty:[1500,3200],hook:[0,1500]}},
  PERF:{fields:['penalty','heat','alt','oat']},
  CONF:{fields:['aux','ffs','ibf','hoist','hook','mm','audio']},
  UNITS:{fields:['latlon','weight','fuel','temp','cable']}
};
const OPTS={aux:[false,true],ffs:[false,true],ibf:[false,true],hoist:[false,true],hook:['NOT INSTALLED','HOOK W/O WEIGHT','SINGLE W/O WEIGHT','SINGLE WITH WEIGHT','DOUBLE W/O WEIGHT','DOUBLE WITH WEIGHT'],mm:['LINEAR','CIRCULAR'],audio:[true,false],
  heat:['ON','OFF'],latlon:["Deg°mm.mmm'","Deg°mm'ss\""],weight:['Kg','Lb'],fuel:['Liter','US Gallon','IMP Gallon','Weight [Kg/Lb]'],temp:['°C','°F'],cable:['Meter','Feet']};
function commitForm(m){
  if(!m.pending||!m.form)return;
  if(m.form==='WEIGHT'){S.wt={...m.pending};note('wt_val');}
  if(m.form==='PERF')S.perf={...m.pending};
  if(m.form==='CONF'){if(!onGround()){toast('CONF só é aceita no solo');return}S.cfg={...m.pending};}
  if(m.form==='UNITS')S.units={...m.pending};
  m.formSel=-1;m.sel=false;toast('Valores validados (VAL)');
}
function onGround(){return S.ias<30&&S.alt<200}
function sensStatus(m){const key=SENSLIST[m.rcnfIdx];return S.sens[key]}
const SENSLIST=['ATT1','ATT2','AIR1','AIR2','HDG1','HDG2','IESI'];
function toggleSens(m){const k=SENSLIST[m.rcnfIdx];if(S.sens[k]==='fail'){toast(k+' falhou: não pode ser selecionado');return}S.sens[k]=S.sens[k]==='ok'?'desel':'ok';note('sens_'+k+'_'+S.sens[k]);}

/* ----------------------------- knob ----------------------------- */
function knob(m,kind){ // ext+ ext- int+ int- push long
  if(!isOn(m))return;
  const d=kind.endsWith('+')?1:kind.endsWith('-')?-1:0;
  const ext=kind.startsWith('ext');
  const p=effPage(m);
  if(kind==='push'||kind==='long'){
    if(p==='FND'&&m.clock==='CHR'){
      if(kind==='long'){m.chr={run:m.chr.run,t0:Date.now(),acc:0};}
      else if(!m.chr.run){m.chr.run=true;m.chr.t0=Date.now();note('chr_start')}
      else{m.chr.acc+=Date.now()-m.chr.t0;m.chr.run=false;}
      return;}
    if(p==='VMS'&&m.form){ if(!m.sel){m.sel=true;m.formSel=0}else{m.formSel=(m.formSel+1)%FORMS[m.form].fields.length} return;}
    if(p==='EFB'){const e=m.efb;if(e.lvl==='LIB'){e.lvl=e.mode==='BOOK'?'TOC':'VIEW';e.idx=0;e.page=1}else if(e.lvl==='TOC'){e.lvl='VIEW';e.page=1+e.idx*3}return}
    if(p==='DMAP'&&m.dm.menu){toast('Item selecionado: '+(DMENU[m.dm.menu]||[])[m.dm.sel]);return}
    if(p==='NAVD'&&kind==='push'){return}
    return;}
  if(p==='FND'){
    if(m.edit==='DA'){S.da=clamp(S.da+d*(ext?100:10),-200,16000)}
    else if(m.edit==='DH'){S.dh=clamp(S.dh+d*(ext?10:1),0,2200)}
    else if(m.edit==='BARO'){S.baro=clamp(S.baro+d*(ext?10:0.5),900,1100);note('baro_'+Math.round(S.baro))}
    else if(m.edit==='RNG'){ if(m.hdgMode==='HOV')m.hsiRng=d>0?2:1;else{const r=[0.5,1,2,5,10,20,40,80,160,240];m.hsiRng=r[clamp(r.indexOf(m.hsiRng)+d,0,r.length-1)]} }
    else{m.mlOff=clamp(m.mlOff+d,0,Math.max(0,S.ml.length-7))}
    if(m.edit==='DH')note('dh_'+S.dh);
  }else if(p==='NAVD'){const r=[0.5,1,2,5,10,20,40,80,160,240];m.navRng=r[clamp(r.indexOf(m.navRng)+d,0,r.length-1)];}
  else if(p==='DMAP'){if(m.dm.menu)m.dm.sel=clamp(m.dm.sel+d,0,4);else m.mapRng=clamp(m.mapRng*(d>0?0.5:2),1,240)}
  else if(p==='VMS'){
    if(m.edit==='TZ'){S.tz=clamp(S.tz+d*0.25,-12,14)}

let tick=0;
function physics(dt){
  tick+=dt;
  powerStep(dt);engStep(dt);apGuard();eqStep();
  if(!S.flying){
    const k=Math.min(1,dt*1.2);S.ias+=(0-S.ias)*k;S.roll+=(0-S.roll)*k;S.pitch+=(0-S.pitch)*k;
    S.alt=Math.max(0,S.alt-Math.max(S.alt,0)*k*0.4);S.vs=S.alt>3?-300:0;S.hdg=(S.hdg+360)%360;
  }else if(!apStep(dt)){
    if(S.climb){S.ias+=clamp(80-S.ias,-4*dt,4*dt);S.vs+=(800-S.vs)*Math.min(1,dt);S.alt+=S.vs*dt/60;S.pitch+=(6-S.pitch)*Math.min(1,dt);if(S.alt>=1500){S.climb=false;S.vs=0}}
    else if(S.auto){
      S.roll=clamp(S.roll+(Math.sin(tick*0.35)*14-S.roll)*0.04,-30,30);
      S.pitch=clamp(2+Math.sin(tick*0.5)*2,-15,20);
      S.hdg=(S.hdg+ S.roll*0.045*dt*10+360)%360;
      S.vs=Math.round(Math.sin(tick*0.22)*350);
      S.alt=clamp(S.alt+S.vs*dt/60,0,18000);
    }else{S.hdg=(S.hdg+360)%360}
  }
  S.gs=S.ias+(S.ias>5?4:0);S.tas=S.ias*(1+S.alt/1000*0.02);
  S.lat+=Math.cos(S.hdg*Math.PI/180)*S.gs/3600*dt/60;S.lon+=Math.sin(S.hdg*Math.PI/180)*S.gs/3600*dt/60/Math.cos(S.lat*Math.PI/180);
  S.mgbP=S.mgbLow?0.8:3*clamp(S.nr/90,0,1);S.mgbT=S.oat+(5+S.pwr*0.3)*clamp(S.nr/90,0,1);
  if(S.burn){[0,1].forEach(i=>{const k=i?'r':'l';S.fuel[k]=Math.max(0,S.fuel[k]-S.ff[i]/3600*dt*8)});
    if(PW.pa||PW.pf)['l','r'].forEach(k=>{const g=Math.min(FT.cap-S.fuel[k],(PW.pa&&PW.pf?0.5:0.3)*dt,S.fuel.m/2);if(g>0){S.fuel.m-=g;S.fuel[k]+=g}});}
  S.max.trq=Math.max(S.max.trq,S.trq[0],S.trq[1]);S.max.tot=Math.max(S.max.tot,S.tot[0],S.tot[1]);S.max.ias=Math.max(S.max.ias,S.ias);S.max.alt=Math.max(S.max.alt,S.alt);
  S.ra=(S.alt<2200&&EQ.RA.ok)?S.alt:null;
  S.dist=Math.max(0.5,S.dist-S.gs/3600*dt*8);if(S.dist<1)S.dist=20;
  S.eta=Math.round(S.dist/Math.max(S.gs,1)*60);
  if(S.ap==='CPL'&&apActive()){S.dtk=354;S.xtk+=(0-S.xtk)*Math.min(1,dt*0.3)}else S.dtk=Math.round((S.hdg+354-30+360)%360);
  gxTick(dt);gxTraf(dt);gaTick(dt);
}

const BOOT_MS=14000;
function wire(body,col,stars){
  body=body.replace(/<polygon\b[^>]*>/g,'');
  body=body.replace(/<(rect|path|circle|ellipse|polyline|line)\b[^>]*>/g,tag=>{
    const f=(tag.match(/\bfill="([^"]*)"/)||[])[1],st=(tag.match(/\bstroke="([^"]*)"/)||[])[1];
    const sw=+((tag.match(/stroke-width="([^"]*)"/)||[])[1]||0);
    if(/^<line/.test(tag))return tag.replace(/stroke="[^"]*"/,`stroke="${st===LN?LN:col}"`);
    if(/^<path/.test(tag)&&sw===7)return tag.replace(/stroke="[^"]*"/,`stroke="${col}"`);
    if(f&&f!=='none'&&f!=='#000'&&!/url\(/.test(f)&&(!st||st==='none')){tag=tag.replace(/fill="[^"]*"/,'fill="none"');return tag.replace(/^<(\w+)/,`<$1 stroke="${col}"`).replace(/stroke="none"/,'')}
    if(f==='#000')return tag;
    if(st&&st!=='none'&&st!==LN&&st!==TX)tag=tag.replace(/stroke="[^"]*"/,`stroke="${col}"`);
    if(f&&f!=='none'&&!/url\(/.test(f))tag=tag.replace(/fill="[^"]*"/,'fill="none"');
    return tag;});
  body=body.replace(/<text\b[^>]*>[^<]*<\/text>/g,t=>{
    const c=(t.match(/>([^<]*)</)||[])[1]||'';
    if(/\d/.test(c)){t=t.replace(/fill="[^"]*"/,`fill="${col}"`);return t.replace(/>([^<]*)</,(mm,x)=>'>'+x.replace(/[-+]?\d[\d.:,]*/g,stars?'***':'')+'<')}
    return t});
  return body;
}

const GXR=Math.PI/180;
function gxBrg(a,b,c,d){const p=a*GXR,q=c*GXR,dl=(d-b)*GXR;return(Math.atan2(Math.sin(dl)*Math.cos(q),Math.cos(p)*Math.sin(q)-Math.sin(p)*Math.cos(q)*Math.cos(dl))/GXR+360)%360}
function gxDis(a,b,c,d){const p=a*GXR,q=c*GXR,dp=q-p,dl=(d-b)*GXR;const h=Math.sin(dp/2)**2+Math.cos(p)*Math.cos(q)*Math.sin(dl/2)**2;return 2*3440.065*Math.asin(Math.min(1,Math.sqrt(h)))}

let tt;function toast(m){[document,...POPDOCS].forEach(d=>{let t=d.getElementById('toast');if(!t){t=d.createElement('div');t.id='toast';d.body.appendChild(t)}t.textContent=m;t.style.display='block'});clearTimeout(tt);tt=setTimeout(()=>[document,...POPDOCS].forEach(d=>{const t=d.getElementById('toast');if(t)t.style.display='none'}),2200)}

function colAct(P,a){
  if(a==='col_bambi')toast('BAMBI DUMP: equipamento opcional (balde de combate a fogo) — não instalado');
  else if(a==='col_cable')toast('CABLE CUT: guincho/gancho opcional — não instalado');
  else if(a==='col_pin'){X.pin=!X.pin;toast(X.pin?'Pino de trava do coletivo inserido':'Pino de trava removido');note('col_pin')}
  else if(a==='col_wiper'){X.wiper={OFF:'ON',ON:'OFF'}[X.wiper];note('wiper')}
  else if(a==='col_floats'){X.floats=!X.floats;toast(X.floats?'FILL FLOATS: flutuadores de emergência cheios (opcional)':'Flutuadores esvaziados');note('floats')}
  else if(a==='col_oei'){X.oei=!X.oei;note('oei_'+(X.oei?'hi':'lo'))}
  else if(P[1]==='sl'){X.sl=P[2]==='1';note('sl_'+P[2])}
  else if(P[1]==='ldg'){X.ldg=P[2]==='1';note('ldg_'+P[2])}
  else if(P[1]==='mir'){X.mir={SL:'S/L',MIR:'MIR',HISL:'HISL'}[P[2]];if(X.mir!=='S/L')toast(X.mir+': equipamento opcional não instalado')}
  else if(P[1]==='dim'||P[1]==='or')toast('Controle do holofote/câmera (opcional) — sem efeito nesta configuração');
}

/* ===== Painel ENG (ENG I / ENG II) e Warning Unit — FLM 7.13.3.5, 3.3 (TRAINING / FADEC EMER), AVM/FLM Helionix ===== */
const WUPW=()=>!!(cbOK('wu1')||cbOK('wu2'));
function engpAct(P){
  const w=P[1],i=+P[2],n=i+1,E=ENG[i];
  if(w==='fgd'){if(GUARD['fem'+n]&&X.fem[i]){toast('Não é possível fechar a proteção com FADEC EMER em ON');return}GUARD['fem'+n]=!GUARD['fem'+n];return}
  if(w==='fon'||w==='foff'){
    if(!GUARD['fem'+n]){GUARD['fem'+n]=true;toast('Proteção da FADEC EMER '+n+' levantada');return}
    const on=w==='fon';if(X.fem[i]===on)return;
    X.fem[i]=on;note('fem_'+n+(on?'_on':'_off'));
    toast(on?'FADEC EMER '+n+': ultimate backup — controle manual do motor '+n+' (resposta lenta)':'FADEC EMER '+n+': controle automático restabelecido');return}
  if(w==='vent'){
    const sw=SW['eng'+n];
    if(E.st==='VENT'){E.st='STOP';X.vent[i]=0;toast('VENT '+n+': ventilação interrompida');return}
    if(sw!=='OFF'){toast('VENT: ENG MAIN '+n+' deve estar em OFF');return}
    if(E.st!=='OFF'||E.n1>=4){toast('VENT: aguarde o motor '+n+' parar');return}
    if(SW.fire[i]){toast('VENT: EMER OFF '+n+' ativo (válvula de combustível fechada)');return}
    if(!(PW.bus.ESS1||PW.bus.ESS2||PW.bus.BAT)||PW.v<18){toast('VENT: sem energia elétrica para o motor de partida');return}
    E.st='VENT';E.t=0;X.vent[i]=Date.now();note('vent_'+n);toast('VENT '+n+': ventilação a seco (motor de partida acionado, sem combustível)');return}
  if(w==='trne'){X.trnE=i;if(X.trn)toast('TRAINING: OEI simulado no motor '+n);return}
  if(w==='trn'){
    if(X.trn){X.trn=false;note('trn_off');toast('TRAINING desligado');return}
    const bad=ENG.some((e,k)=>e.st!=='RUN'||SW['eng'+(k+1)]!=='FLIGHT'||SW.fire[k]||X.fem[k]);
    if(bad){toast('TRAINING: exige os dois motores em FLIGHT, sem FADEC EMER nem EMER OFF');return}
    if(!S.flying){toast('TRAINING: só em voo');return}
    X.trn=true;note('trn_on');toast('TRAINING: OEI simulado no motor '+(X.trnE+1)+' (ENG'+(X.trnE+1)+' TRAINING)')}
}

function wuSVG(){
  const pw=WUPW(),now=Date.now();
  const on=re=>pw&&ALERTS.some(a=>a.c==='W'&&re.test(a.t)&&alertOn(a.id));
  const fireL=n=>pw&&(alertOn(mkAlert('ENG'+n+' FIRE','W'))||X.g['ft'+n]==='TEST');
  const extL=n=>pw&&((SW.bot[n-1]&&now-SW.botT2<6000)||X.g.extwrn==='TEST');
  const T=(x,y,t,sz,an,f,cls)=>`<text x="${x}" y="${y}" font-size="${sz}" text-anchor="${an||'middle'}" font-weight="700" fill="${f}" ${cls?'class="'+cls+'"':''}>${t}</text>`;
  const scr=(x,y)=>`<circle cx="${x}" cy="${y}" r="7" fill="#2c3139" stroke="#59616d"/><path d="M${x-4} ${y-4}L${x+4} ${y+4}M${x+4} ${y-4}L${x-4} ${y+4}" stroke="#0e0f10" stroke-width="1.6"/>`;
  let s=`<svg viewBox="0 0 745 84" style="width:100%;max-width:980px;display:block;margin:auto" font-family="Arial,Helvetica,sans-serif">`;
  s+=`<rect x="1" y="1" width="743" height="82" rx="8" fill="#202225" stroke="#454c57" stroke-width="2"/><rect x="36" y="8" width="673" height="68" rx="4" fill="#050505" stroke="#6b7078" stroke-width="1.4"/>`;
  s+=scr(18,22)+scr(18,62)+scr(727,22)+scr(727,62);
  const grp=(i,bx,fx,tx,txLeft,ox0,ox1)=>{const n=i+1,fl=fireL(n),ac=pw&&SW.fire[i],gu=!!GUARD['fire'+n],used=SW.bot[i];
    let h=`<rect x="${ox0}" y="13" width="${ox1-ox0}" height="64" rx="9" fill="none" stroke="#e8ecf1" stroke-width="1.4"/>`;
    /* BOT */
    h+=`<rect x="${bx}" y="26" width="46" height="44" rx="3" fill="#0a0a0a" stroke="#8a8f97" stroke-width="1.4"/><rect x="${bx+4}" y="30" width="38" height="36" rx="2" fill="none" stroke="#5d626a"/>`;
    h+=T(bx+23,52,'BOT '+n,11.5,'middle',pw&&!used?'#ffd60a':'#2b2a10')+T(bx+23,20,'EXT',11,'middle',extL(n)?'#2ecc40':'#0c2410');
    h+=`<rect x="${bx}" y="26" width="46" height="44" fill="#000" fill-opacity="0" data-a="bot${i}" style="cursor:pointer"/>`;
    /* FIRE / EMER OFF */
    h+=`<rect x="${fx}" y="19" width="56" height="54" rx="3" fill="${ac?'#2a0d0b':'#0a0a0a'}" stroke="#8a8f97" stroke-width="1.4"/>`;
    h+=T(fx+28,52,'FIRE',19,'middle',fl?'#ff3b2f':'#2e0f0c',fl?'wfl':'');
    if(!gu)h+=`<rect x="${fx+2}" y="21" width="52" height="50" fill="none" stroke="#e03a2c" stroke-width="2"/><path d="M${fx+28} 21V71M${fx+2} 46H${fx+54}" stroke="#e03a2c" stroke-width="2"/>`;
    else h+=`<path d="M${fx+3} 14H${fx+53}" stroke="#e03a2c" stroke-width="4" stroke-linecap="round"/>`;
    h+=`<rect x="${fx}" y="12" width="56" height="62" fill="#000" fill-opacity="0" data-a="fire${i}" style="cursor:pointer"/>`;
    h+=T(txLeft,28,'EMER',11,'start','#e8ecf1')+T(txLeft,40,'OFF',11,'start','#e8ecf1')+T(txLeft,52,'SW '+n,11,'start','#e8ecf1');
    h+=T(txLeft,71,'ACTIVE',11,'start',ac?'#2ecc40':'#0c2410');
    return h};
  s+=grp(0,58,112,172,172,106,214)+grp(1,645,583,0,546,538,640);
  /* lâmpadas centrais */
  const lamp=(x,y,w,t,lit,col)=>`<rect x="${x}" y="${y}" width="${w}" height="24" rx="2" fill="${lit?col:'#070707'}" stroke="${lit?'#fff3':'#141414'}"/>`+T(x+w/2,y+16,t,10,'middle',lit?(col==='#c78a00'?'#000':'#fff'):'#202020',lit?'wfl':'');
  const nrBad=S.flying&&(S.nr<95||S.nr>106);
  const R='#b3261e',A='#c78a00';
  const top=[['LOW FUEL 1',on(/FUEL1 LOW|LOW FUEL1/),R],['ENG 1 FAIL',on(/ENG1 FAIL|FAIL ENG1/)||(pw&&ENG[0].st==='OFF'&&S.flying),R],['ROTOR RPM',pw&&(nrBad||on(/ROTOR RPM/)),R],['ENG 2 FAIL',on(/ENG2 FAIL|FAIL ENG2/)||(pw&&ENG[1].st==='OFF'&&S.flying),R],['LOW FUEL 2',on(/FUEL2 LOW|LOW FUEL2/),R]];
  top.forEach((l,k)=>s+=lamp(228+k*61,14,58,l[0],l[1],l[2]));
  const bot=[['BAT OVHT',on(/BAT OVERHEAT/),R],['MGB OIL P',on(/MGB (LOW PRESS|OIL)/),R],['AP',on(/^AUTOPILOT/),R],['CARGO SMOKE',on(/CARGO SMOKE/),R]];
  bot.forEach((l,k)=>s+=lamp(227+k*77,46,74,l[0],l[1],l[2]));
  return s+`</svg>`;
}

    b.addEventListener('pointerdown',onCpDown);b.addEventListener('pointerup',onCpUp);
    b.addEventListener('contextmenu',e=>e.preventDefault());
    b.addEventListener('wheel',e=>{const kw=e.target.closest('[data-kw]');if(kw){e.preventDefault();const a2=kw.dataset.kw+'_'+(e.deltaY<0?1:-1);runAct(a2,a2.split('_'),kw);return}const kr=e.target.closest('[data-kr]');if(!kr)return;e.preventDefault();const sv=kr.closest('svg'),dir=e.deltaY<0?1:-1;
      const a2=sv.dataset.gk==='vol'?'gvol_'+(dir*5):((e.shiftKey||kr.dataset.kr==='o')?'gko_':'gki_')+dir;runAct(a2,a2.split('_'),kr)},{passive:false});
    b.addEventListener('change',e=>{if(e.target.matches('select[data-a="tk"]'))PW.tk=+e.target.value});
    b.addEventListener('input',e=>{const v=e.target.dataset&&e.target.dataset.v;if(!v)return;const A=X.acu;
      if(v.startsWith('rx_'))A.vol[+v.slice(3)]=+e.target.value;else A[v]=+e.target.value});
  }
  el.addEventListener('click',e=>{
    const bt=e.target.closest('[data-pa]');if(!bt||!el.contains(bt))return;const a=bt.dataset.pa;
    if(a==='zin'||a==='zout'){p.zoom=Math.max(.5,Math.min(2,+(p.zoom+(a==='zin'?.1:-.1)).toFixed(2)));LAY.zoom[id]=p.zoom;applyLayout()}
    else if(a==='wide'){const n=colCount();LAY.span[id]=((LAY.span[id]||1)%Math.min(3,n))+1;applyLayout()}
    else if(a==='close'){LAY.on[id]=false;applyLayout()}
    else if(a==='pop')popMenu(p,bt);
    else if(a==='dock')dockBack(id,true);
    else if(a==='fs'){const de=p.win&&p.win.document.documentElement;if(de&&de.requestFullscreen)de.requestFullscreen().catch(()=>{})}
  });
  /* arrastar: reordenar na grade ou soltar fora do navegador = nova janela */
  p.head.addEventListener('dragstart',e=>{if(p.win){e.preventDefault();return}DRAGID=id;e.dataTransfer.setData('text/plain',id);e.dataTransfer.effectAllowed='move';el.classList.add('dragging')});
  p.head.addEventListener('dragend',e=>{
    el.classList.remove('dragging');const had=DRAGID;DRAGID=null;if(!had)return;
    if(e.dataTransfer.dropEffect==='none'){
      const w=window,out=e.screenX<w.screenX||e.screenX>w.screenX+w.outerWidth||e.screenY<w.screenY||e.screenY>w.screenY+w.outerHeight;
      if(out){const r=el.getBoundingClientRect();popOut(id,Math.round(e.screenX-80),Math.round(e.screenY-20),Math.max(420,Math.round(r.width)+24),Math.round(r.height)+70)}
    }
  });
});
wsEl.addEventListener('dragover',e=>{if(!DRAGID)return;e.preventDefault();e.dataTransfer.dropEffect='move'});
wsEl.addEventListener('drop',e=>{
  if(!DRAGID)return;e.preventDefault();
  const t=e.target.closest('.pnl');if(!t||t.dataset.pid===DRAGID)return;
  const r=t.getBoundingClientRect(),before=(e.clientX-r.left)/r.width<.5||(e.clientY-r.top)/r.height<.25;
  const o=LAY.order.filter(x=>x!==DRAGID),ti=o.indexOf(t.dataset.pid);o.splice(before?ti:ti+1,0,DRAGID);LAY.order=o;applyLayout();
});

/* --- layout --- */
function colCount(){
  if(LAY.cols!=='auto')return +LAY.cols;
  return Math.max(1,Math.min(3,PANELS.filter(p=>p.on&&!p.win).length));
}
function applyLayout(){
  const n=colCount();wsEl.style.gridTemplateColumns=`repeat(${n},minmax(0,1fr))`;
  PANELS.forEach(p=>{
    p.on=!!LAY.on[p.id];p.zoom=LAY.zoom[p.id]||1;
    p.el.classList.toggle('hide',!p.on);
    p.el.style.order=LAY.order.indexOf(p.id);
    p.el.style.gridColumn='span '+Math.min(LAY.span[p.id]||1,n);
    p.body.style.zoom=p.zoom;
    p.last=null;
  });
  document.querySelectorAll('#bar [data-tp]').forEach(b=>b.classList.toggle('on',!!LAY.on[b.dataset.tp]));
  $id('colSel').value=String(LAY.cols);
  renderStatic();saveLast();
}
function setLayout(l){
  LAY.cols=l.cols||'auto';
  LAY.order=(l.order||[]).filter(id=>PMAP[id]);PANELS.forEach(p=>{if(!LAY.order.includes(p.id))LAY.order.push(p.id)});
  LAY.on={};LAY.span={};LAY.zoom={};
  PANELS.forEach(p=>{LAY.on[p.id]=!!(l.on&&l.on[p.id]);LAY.span[p.id]=(l.span&&l.span[p.id])||1;LAY.zoom[p.id]=(l.zoom&&l.zoom[p.id])||1});
  PANELS.forEach(p=>{if(!LAY.on[p.id]&&p.win)dockBack(p.id,true)});
  applyLayout();
}
const LSK='h145_ws_v1';
function lsGet(){try{return JSON.parse(localStorage.getItem(LSK)||'{}')}catch(e){return {}}}
function lsSet(o){try{localStorage.setItem(LSK,JSON.stringify(o))}catch(e){}}
function saveLast(){const o=lsGet();o.last=JSON.parse(JSON.stringify(LAY));lsSet(o)}
const mkL=(list,cols)=>({cols:cols||'auto',order:list.map(x=>x[0]),on:Object.fromEntries(list.map(x=>[x[0],1])),span:Object.fromEntries(list.map(x=>[x[0],x[1]||1]))});
const PRESETS={
 'Visão geral: 3 MFDs + overhead + instrutor':mkL([['MFD1'],['MFD4'],['MFD2'],['OH',2],['INSTR']],3),
 'Notebook: Overhead · MFD 4 · MFD 2':mkL([['OH'],['MFD4'],['MFD2']],3),
 'Overhead · GTN 1 · MFD 2':mkL([['OH'],['GTN1'],['MFD2']],3),
 'Energia: Overhead · Barramentos · CBs':mkL([['OH',2],['BUS'],['CB',3]],3),
 'AFCS: APCP · cíclico · coletivo · MFD 2':mkL([['APCP',2],['MFD2'],['CYC'],['COL']],3),
 'Fogo e alertas: Warning Unit · MFD 4 · Overhead':mkL([['WARN'],['MFD4'],['OH']],3),
 'Motores: painel ENG · Warning Unit · MFD 4':mkL([['ENGP',2],['WARN',2],['MFD4']],3),
 'Comunicação: ACU · ELT · GTN 1 · GTN 2':mkL([['ACU',2],['ACU2',2],['ELT'],['GTN1'],['GTN2']],3),
 'Só os 3 MFDs':mkL([['MFD1'],['MFD4'],['MFD2']],3),
 'Cenários: MFD 4 · MFD 2 · Instrutor':mkL([['MFD4'],['MFD2'],['INSTR']],3),
 'Todos os painéis':mkL(PDEF.map(d=>[d[0]]),3)};
function fillLaySel(cur){
  const sv=lsGet().saved||{},s=$id('laySel');
  s.innerHTML=`<option value="">— layout —</option><optgroup label="Predefinidos">${Object.keys(PRESETS).map(k=>`<option value="p:${k}">${k}</option>`).join('')}</optgroup>`+
    (Object.keys(sv).length?`<optgroup label="Salvos por você">${Object.keys(sv).map(k=>`<option value="s:${k}">${k}</option>`).join('')}</optgroup>`:'');
  if(cur)s.value=cur;
}
/* --- barra --- */
(function buildBar(){
  const bar=$id('bar');
  bar.innerHTML=`<div class="bg"><span class="bl">Painéis:</span></div>`+
   GRP.map(([g,ids])=>`<div class="bg bgx"><span class="bl">${g}</span>${ids.map(id=>`<button class="c2" data-tp="${id}">${PMAP[id].short}</button>`).join('')}</div>`).join('<span class="gs bgx"></span>')+
   `<span class="gs"></span><div class="bg"><select id="laySel" title="Layouts predefinidos e salvos"></select><button id="layNew" title="Salvar o arranjo atual com um nome">Salvar…</button><button id="layDel" title="Excluir o layout salvo selecionado">Excluir</button>
    <select id="colSel" title="Colunas da grade"><option value="auto">Colunas: auto</option><option value="1">1 coluna</option><option value="2">2 colunas</option><option value="3">3 colunas</option><option value="4">4 colunas</option></select>
    <button id="barMin" title="Recolher/expandir a barra">▲</button><span id="popCnt" class="note"></span><span class="note" title="Clique ⧉ no painel (ou arraste o título para fora do navegador) para abrir em outra janela/monitor. Ctrl+roda aumenta/diminui uma janela. Reordene arrastando o título sobre outro painel. Knob duplo: roda do mouse = anel interno · Shift+roda = externo · clique = push (≥0,6 s = longo).">ⓘ ajuda</span></div>`;
  bar.addEventListener('click',e=>{
    const b=e.target.closest('[data-tp]');
    if(b){const id=b.dataset.tp;LAY.on[id]=!LAY.on[id];if(!LAY.on[id]&&PMAP[id].win)dockBack(id,true);
      if(LAY.on[id]){LAY.order=LAY.order.filter(x=>x!==id);LAY.order.push(id)}applyLayout()}
  });
  $id('laySel').onchange=e=>{const v=e.target.value;if(!v)return;
    if(v[0]==='p')setLayout(PRESETS[v.slice(2)]);else{const sv=lsGet().saved||{};if(sv[v.slice(2)])setLayout(sv[v.slice(2)])}};
  $id('layNew').onclick=()=>{const n=(prompt('Nome do layout:')||'').trim();if(!n)return;const o=lsGet();o.saved=o.saved||{};o.saved[n]=JSON.parse(JSON.stringify(LAY));lsSet(o);fillLaySel('s:'+n);toast('Layout salvo: '+n)};
  $id('layDel').onclick=()=>{const v=$id('laySel').value;if(!v||v[0]!=='s'){toast('Selecione um layout salvo para excluir');return}const o=lsGet();delete (o.saved||{})[v.slice(2)];lsSet(o);fillLaySel('');toast('Layout excluído')};
  $id('colSel').onchange=e=>{LAY.cols=e.target.value;applyLayout()};
  $id('barMin').onclick=e=>{bar.classList.toggle('min');e.target.textContent=bar.classList.contains('min')?'▼':'▲'};
  fillLaySel('');
})();

/* --- janelas externas --- */
function popOut(id,sx,sy,w,h){
  const p=PMAP[id];if(!p||p.win&&!p.win.closed){if(p&&p.win)p.win.focus();return}
  const feat='popup=yes,width='+(w||560)+',height='+(h||760)+(sx!=null?',left='+sx+',top='+sy:'');
  const win=window.open('','h145_'+id,feat);
  if(!win){toast('Pop-up bloqueado: permita pop-ups para esta página (ícone na barra de endereço) e tente novamente');return}
  const d=win.document;d.open();d.write('<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>'+p.title+' — H145</title></head><body class="popbody"></body></html>');d.close();
  document.querySelectorAll('style').forEach(s=>d.head.appendChild(s.cloneNode(true)));
  d.body.appendChild(p.el);p.el.classList.add('popped');p.el.style.order='';p.el.style.gridColumn='';
  POPDOCS.push(d);DL.forEach(([t,f,o])=>d.addEventListener(t,f,o));
  p.win=win;refreshHead(p);
  win.addEventListener('pagehide',()=>dockBack(id,false));
  win.addEventListener('keydown',ev=>{if(ev.key==='F11'){ev.preventDefault();const de=d.documentElement;if(d.fullscreenElement)d.exitFullscreen();else de.requestFullscreen&&de.requestFullscreen().catch(()=>{})}});
  applyLayout();popCount();
}
function dockBack(id,closeWin){
  const p=PMAP[id];if(!p||!p.win)return;
  const win=p.win,d=win.document;p.win=null;
  const k=POPDOCS.indexOf(d);if(k>=0)POPDOCS.splice(k,1);
  p.el.classList.remove('popped');wsEl.appendChild(p.el);refreshHead(p);
  if(closeWin){try{win.close()}catch(e){}}
  applyLayout();popCount();
}
function popCount(){const n=PANELS.filter(p=>p.win).length;const e=$id('popCnt');if(e)e.textContent=n?n+' em janela externa':''}
setInterval(()=>PANELS.forEach(p=>{if(p.win&&p.win.closed)dockBack(p.id,false)}),1500);
window.addEventListener('beforeunload',()=>PANELS.forEach(p=>{if(p.win)try{p.win.close()}catch(e){}}));
let SCRS=null;
function closeMenu(){document.querySelectorAll('.pmenu').forEach(m=>m.remove())}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.pmenu'))closeMenu()});
function popMenu(p,btn){
  closeMenu();
  const m=document.createElement('div');m.className='pmenu';
  const r=btn.getBoundingClientRect();m.style.left=Math.max(4,Math.min(innerWidth-250,r.left-190))+'px';m.style.top=(r.bottom+4)+'px';
  const pr=p.el.getBoundingClientRect(),w=Math.max(420,Math.round(pr.width)+24),h=Math.round(pr.height)+70;
  const add=(t,fn)=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{closeMenu();fn()};m.appendChild(b)};
  add('⧉ Nova janela (depois arraste para outro monitor)',()=>popOut(p.id,undefined,undefined,w,h));
  if(SCRS)SCRS.forEach((s,i)=>add('→ '+(s.label||'Tela '+(i+1))+(s.isPrimary?' (principal)':'')+' · '+s.width+'×'+s.height,()=>popOut(p.id,s.availLeft+16,s.availTop+16,Math.min(w,s.availWidth-32),Math.min(h,s.availHeight-32))));
  else if(window.getScreenDetails)add('🖥 Detectar monitores (pede permissão)…',async()=>{try{const sd=await window.getScreenDetails();SCRS=sd.screens;toast(SCRS.length+' tela(s) detectada(s)');popMenu(p,btn)}catch(e){toast('Permissão de múltiplas telas negada — use "Nova janela" e arraste')}});
  document.body.appendChild(m);
}

/* loop */
let last=performance.now();
function frame(){
  const now=performance.now();const dt=Math.min(0.2,(now-last)/1000);last=now;
  physics(dt);
  S.ml.forEach(()=>{});
  if(alertOn('E1FAIL'))LOG.add('ever_e1');
  MFDS.forEach((m,i)=>{
    if(!PMAP[m.id].on)return;
    $id('scr'+i).innerHTML=screen(m);
    $id('led'+i).setAttribute('fill',isOn(m)?'#2a2':'#a22');
  });
  renderTasks.n=(renderTasks.n||0)+1;
  cockpitTick();
  if(renderTasks.n%5===0&&!anyFocusInput())cockpitRender();
  if(renderTasks.n%10===0){renderTasks();renderGuide();renderScen();}
}
coldStart();
buildInstr();renderScen();renderGuide();renderTasks();renderFontes();
(function(){const o=lsGet();setLayout(o.last&&o.last.on?o.last:PRESETS['Visão geral: 3 MFDs + overhead + instrutor'])})();
setAlert('TRAIN',false);
frame();
try{const tw=new Worker(URL.createObjectURL(new Blob(['setInterval(()=>postMessage(0),60)'],{type:'text/javascript'})));tw.onmessage=()=>frame()}catch(err){setInterval(frame,60)}
</script>
